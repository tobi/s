[package]
name = "s"
version = "0.9.5"
edition = "2021"
description = "Encrypted env store — agents use secrets without seeing them"
license = "MIT"
repository = "https://github.com/tobi/s"
homepage = "https://github.com/tobi/s"
readme = "README.md"
exclude = [".senv"]

[[bin]]
name = "s"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
argon2 = "0.5"
zeroize = "1"
libc = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/s-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "s{ binary-ext }"
